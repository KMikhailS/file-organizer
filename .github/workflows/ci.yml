# Host checks for every push and pull request (docs/stage2_android.md,
# section 10). Emulator tests run locally (integration_test/*/run_android.sh).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Format, analyze, test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the local toolchain (pubspec.yaml: sdk ^3.13.5).
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- .

      - name: Pigeon code is up to date
        run: |
          dart run pigeon --input pigeons/native_api.dart
          dart format lib/platform/android/native_api.g.dart
          git diff --exit-code -- .

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-lint:
    name: Android Lint (Kotlin, manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # The Gradle wrapper and local.properties are not in the repository
      # (Flutter template); this writes them without building.
      - name: Gradle configuration
        run: flutter build apk --config-only

      # Catches, among others, calls to APIs newer than minSdk (NewApi).
      - name: Lint
        working-directory: app/android
        run: ./gradlew :app:lintDebug
