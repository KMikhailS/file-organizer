# Host checks for every push and pull request (docs/stage2_android.md,
# section 10). Emulator tests run locally (integration_test/*/run_android.sh).
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Format, analyze, test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the local toolchain (pubspec.yaml: sdk ^3.13.5).
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- .

      - name: Pigeon code is up to date
        run: |
          dart run pigeon --input pigeons/native_api.dart
          dart format lib/platform/android/native_api.g.dart
          git diff --exit-code -- .

      - name: Localization code is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- .

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android-lint:
    name: Android Lint (Kotlin, manifest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # The Gradle wrapper and local.properties are not in the repository
      # (Flutter template); this writes them without building.
      - name: Gradle configuration
        run: flutter build apk --config-only

      # Catches, among others, calls to APIs newer than minSdk (NewApi).
      - name: Lint
        working-directory: app/android
        run: ./gradlew :app:lintDebug

  full-cycle:
    name: Full cycle on an emulator (API 34)
    # docs/stage2_android.md, 5.25: the real app through the UI on the test
    # root of an emulator; the other device suites run locally.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build debug APK
        # Before the emulator starts: a cold Gradle build (with the native
        # sqlite3 library) takes long on CI, and the runner script then
        # finds everything up to date.
        run: flutter build apk --debug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Full cycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: app
          script: FLUTTER=flutter integration_test/full_cycle/run_android.sh emulator-5554

      - name: Show the end of the test log
        if: failure() || cancelled()
        run: tail -60 build/full_cycle_test.log || true

      - name: Keep the test log
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: full-cycle-log
          path: app/build/full_cycle_test.log
