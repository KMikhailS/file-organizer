name: file_organizer
description: "Scans user files, removes duplicates, sorts files into a fixed folder template and can undo every cleanup."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  # Typed SQLite for the local database (docs/architecture.md, section 14);
  # used only in lib/data/.
  drift: ^2.35.1
  # @immutable for the domain model (pure Dart, already pinned by Flutter).
  meta: ^1.18.3
  # renameat2, mkdir, rmdir and errno from the system C library
  # (docs/stage2_android.md, section 12); used only in lib/platform/ and the
  # A.5 experiment.
  ffi: ^2.2.0
  # SHA-256 for file hashes (docs/stage2_android.md, section 12); a Dart
  # team package, used only in lib/platform/.
  crypto: ^3.0.7

dev_dependencies:
  # Code generation for drift (lib/data/ only).
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory SQLite for the drift repository tests.
  sqlite3: ^3.7.0
  # Dart <-> Kotlin contract generation (docs/architecture.md; pigeons/).
  pigeon: ^29.0.7
  # Tests on Android emulators (integration_test/).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
